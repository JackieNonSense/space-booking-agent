<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Alpha mask for the BOOKED stamp: static noise, thresholded so roughly one
       spot in five lets the paper show through, like ink that didn't take. -->
  <filter id="ink" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" />
    <feComponentTransfer>
      <feFuncA type="discrete" tableValues="0 0 1 1 1 1 1" />
    </feComponentTransfer>
  </filter>
  <rect width="160" height="160" filter="url(#ink)" />
</svg>
